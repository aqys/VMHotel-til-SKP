services:
  db:
    image: postgres:17-alpine
    container_name: skpvmportal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: skpvmportal
      POSTGRES_PASSWORD: skpvmportal
      POSTGRES_DB: skpvmportal
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skpvmportal -d skpvmportal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
