auto lo
iface lo inet loopback

iface ens1f0 inet manual

iface ens1f1 inet manual

iface ens1f2 inet manual

iface ens1f3 inet manual

iface eno1 inet manual

iface eno2 inet manual

auto vmbr0
iface vmbr0 inet static
        address 10.47.47.11/24
        gateway 10.47.47.250
        bridge-ports ens1f0 ens1f1
        bridge-stp off
        bridge-fd 0

auto vmbr0.90
iface vmbr0.90 inet manual

auto vmbr90
iface vmbr90 inet manual
        bridge-ports vmbr0.90
        bridge-stp off
        bridge-fd 0

source /etc/network/interfaces.d/*
